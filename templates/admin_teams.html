{% extends "base.html" %}
{% block title %}إدارة الفرق{% endblock %}

{% block content %}
<section class="form-section">
    <h1>إضافة فريق جديد</h1>
    <form method="POST" class="camp-form">
        <input type="hidden" name="form_type" value="new_team">
        <label>اسم الفريق *</label>
        <input type="text" name="name" required placeholder="مثال: فريق الأمل">
        <button type="submit" class="btn-main">إضافة الفريق</button>
    </form>
</section>

<section class="form-section" style="margin-top:2rem;">
    <h1>تعيين طالب لفريق</h1>
    <form method="POST" class="camp-form">
        <input type="hidden" name="form_type" value="assign">
        <label>الطالب *</label>
        <select name="student_id" required>
            {% for s in students %}
            <option value="{{ s.id }}">{{ s.full_name }} {% if s.team_id %}(فريق حالي: {{ s.team_id }}){% endif %}</option>
            {% endfor %}
        </select>
        <label>الفريق</label>
        <select name="team_id">
            <option value="">بدون فريق</option>
            {% for t in teams %}
            <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn-main">تعيين</button>
    </form>
</section>

<section class="admin-section">
    <h2 style="color:#2d6a4f; margin:1.5rem 0 0.8rem;">الفرق الحالية</h2>
    <table class="students-table">
        <thead><tr><th>الفريق</th><th>تاريخ الإنشاء</th></tr></thead>
        <tbody>
            {% for t in teams %}
            <tr><td>{{ t.name }}</td><td>{{ t.created_at }}</td></tr>
            {% else %}
            <tr><td colspan="2">لسه مفيش فرق</td></tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
